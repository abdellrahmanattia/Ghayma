<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكرة الأرضية ثلاثية الأبعاد</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family:Tahoma, Arial, sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  #ui { position:fixed; top:12px; left:12px; right:12px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; pointer-events:none; }
  button { pointer-events:auto; background:rgba(20,30,50,.75); color:#fff; border:1px solid #4a6a9a; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  button.on { background:#2b6cb0; }
  #zoom { position:fixed; bottom:20px; left:12px; display:flex; flex-direction:column; gap:6px; }
  #status { position:fixed; bottom:14px; left:0; right:0; text-align:center; font-size:13px; opacity:.9; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <button id="bBorders" class="on">الحدود</button>
  <button id="bRotate">دوران تلقائي</button>
  <button id="bReset">إعادة الضبط</button>
</div>
<div id="zoom">
  <button id="zIn">+</button>
  <button id="zOut">−</button>
</div>
<div id="status">جاري تحميل البيانات...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>
<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
let camDist = 3.2;
camera.position.set(0, 0, camDist);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 2, 4);
scene.add(sun);

// root: يتحكم فيه المستخدم | tilt: ميل محور الأرض
const root = new THREE.Group();
root.rotation.order = 'YXZ';
root.rotation.y = -0.6;
scene.add(root);
const tilt = new THREE.Group();
tilt.rotation.z = THREE.MathUtils.degToRad(23.4);
root.add(tilt);

// ===== الأرض =====
const loader = new THREE.TextureLoader();
loader.setCrossOrigin('anonymous');
const IMG = 'https://cdn.jsdelivr.net/npm/three-globe@2.30.0/example/img/';

const earthMat = new THREE.MeshPhongMaterial({
  map: loader.load(IMG + 'earth-blue-marble.jpg',
    () => statusEl.textContent = 'اسحب للدوران • العجلة أو + و − للتكبير',
    undefined,
    () => statusEl.textContent = 'تعذر تحميل صورة الأرض، تأكد من الإنترنت'),
  bumpMap: loader.load(IMG + 'earth-topology.png'),
  bumpScale: 0.02,
  specular: new THREE.Color(0x333333),
  shininess: 10
});
const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), earthMat);
tilt.add(earth);

// توهج الغلاف الجوي
const atmo = new THREE.Mesh(
  new THREE.SphereGeometry(1.12, 64, 64),
  new THREE.ShaderMaterial({
    vertexShader: `
      varying vec3 vN;
      void main(){
        vN = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vN;
      void main(){
        float i = pow(0.72 - dot(vN, vec3(0.0, 0.0, 1.0)), 3.0);
        gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * i;
      }`,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    transparent: true,
    depthWrite: false
  })
);
scene.add(atmo);

// ===== الحدود الدولية =====
const borders = new THREE.Group();
tilt.add(borders);

// تحويل خط الطول والعرض لإحداثيات 3D
function ll(lon, lat, r = 1.002) {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return [r * Math.cos(la) * Math.cos(lo), r * Math.sin(la), -r * Math.cos(la) * Math.sin(lo)];
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(topo => {
    const mesh = topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b);
    const pts = [];
    for (const line of mesh.coordinates) {
      for (let i = 0; i < line.length - 1; i++) {
        const [lon1, lat1] = line[i], [lon2, lat2] = line[i + 1];
        if (Math.abs(lon1 - lon2) > 180) continue;
        pts.push(...ll(lon1, lat1), ...ll(lon2, lat2));
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    borders.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.8 })));
  })
  .catch(err => {
    console.error(err);
    statusEl.textContent = 'تعذر تحميل بيانات الحدود: ' + err.message;
  });

setTimeout(() => statusEl.style.display = 'none', 5000);

// ===== التحكم =====
const pointers = new Map();
let autoRot = false;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  if (pointers.size === 1) {
    root.rotation.y += (e.clientX - prev.x) * 0.005;
    root.rotation.x = THREE.MathUtils.clamp(root.rotation.x + (e.clientY - prev.y) * 0.005, -1.5, 1.5);
  }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (window._lastPinch) camDist = THREE.MathUtils.clamp(camDist * window._lastPinch / d, 1.08, 6);
    window._lastPinch = d;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  window._lastPinch = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = THREE.MathUtils.clamp(camDist * Math.exp(e.deltaY * 0.001), 1.08, 6);
}, { passive: false });

document.getElementById('zIn').onclick = () => camDist = Math.max(1.08, camDist * 0.8);
document.getElementById('zOut').onclick = () => camDist = Math.min(6, camDist * 1.25);

const bBorders = document.getElementById('bBorders');
bBorders.onclick = () => { borders.visible = !borders.visible; bBorders.classList.toggle('on', borders.visible); };

const bRotate = document.getElementById('bRotate');
bRotate.onclick = () => { autoRot = !autoRot; bRotate.classList.toggle('on', autoRot); };

document.getElementById('bReset').onclick = () => {
  root.rotation.set(0, -0.6, 0);
  camDist = 3.2;
};

// ===== الحلقة الرئيسية =====
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  if (autoRot && pointers.size === 0) root.rotation.y += 0.002;
  camera.position.z += (camDist - camera.position.z) * 0.15;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
